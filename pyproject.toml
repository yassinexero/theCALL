[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with a small language model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
    "llm-sdk",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[dependency-groups]
dev = [
    "flake8>=7",
    "mypy>=1",
]
